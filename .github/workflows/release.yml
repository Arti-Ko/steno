name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия из тега
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с файлом VERSION"
            exit 1
          fi
          echo "STENO_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Инструменты
        run: |
          xcodebuild -version
          swift --version

      - name: Кэш SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Тесты
        run: swift test

      - name: Сборка установщика
        run: Scripts/package.sh

      - name: Описание выпуска
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## Что нового"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --pretty='- %s' "$PREVIOUS..$GITHUB_REF_NAME" \
                | grep -vE '^- (chore|ci|test|docs|build)(\(.*\))?!?:' \
                | sed -E 's/^- [a-z]+(\([^)]*\))?!?: /- /' || true
            else
              echo "- Первый выпуск"
            fi
            echo
            cat .github/release-notes.md
          } > dist/notes.md
          cat dist/notes.md

      - name: Публикация выпуска
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Steno.dmg
            dist/Steno.zip
          body_path: dist/notes.md
