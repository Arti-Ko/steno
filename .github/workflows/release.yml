name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия из тега
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с файлом VERSION"
            exit 1
          fi
          echo "STENO_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Инструменты
        run: |
          xcodebuild -version
          swift --version

      - name: Кэш SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Тесты
        run: swift test

      - name: Сборка установщика
        run: Scripts/package.sh

      - name: Публикация выпуска
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Steno.dmg
            dist/Steno.zip
          body_path: .github/release-notes.md
          generate_release_notes: true
